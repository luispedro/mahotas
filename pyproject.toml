[build-system]
requires = [
    "meson-python>=0.17.1,<0.18",
    "meson>=1.2.3",
    "ninja",
    "numpy",
]
build-backend = "mesonpy"

[project]
name = "mahotas"
dynamic = ["version"]
description = "Mahotas: Computer Vision Library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Luis Pedro Coelho", email = "luis@luispedro.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://luispedro.org/software/mahotas"
Documentation = "https://mahotas.readthedocs.io/"
Repository = "https://github.com/luispedro/mahotas"
Issues = "https://github.com/luispedro/mahotas/issues"

[project.optional-dependencies]
tests = [
    "matplotlib",
    "pip",
    "coveralls",
    "meson-python>=0.17.1,<0.18",
    "meson>=1.2.3",
    "ninja",
    "pytest",
    "scipy",
    "pillow",
]

[project.scripts]
mahotas-features = "mahotas.features_cli:main"

[tool.cibuildwheel]
# Run the tests against the installed wheel: pointing pytest at
# {project}/mahotas/tests makes it import the (uncompiled) source tree.
test-command = "pytest --pyargs mahotas.tests"
test-extras = ["tests"]
# Match the versions in the classifiers: no free-threaded (cp31xt) builds and no
# Python 3.15 until it is released and declared supported
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*musllinux*"]
environment = {PIP_PREFER_BINARY = "1"}

[tool.cibuildwheel.windows]
# No 32-bit numpy/scipy wheels for the supported Python versions
archs = ["AMD64"]
# Force MSVC: otherwise meson picks up the MinGW gcc on the runner's PATH
config-settings = {setup-args = "--vsenv"}
